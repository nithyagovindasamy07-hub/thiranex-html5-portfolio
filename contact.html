  <main id="main-content" class="page-content">
    <h1>Contact Me</h1>
    <p>Have a project idea? You can fill in this form.</p>

    <form class="contact-form" action="#" method="get">
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        autocomplete="name"
        required>

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        required>

      <label for="subject">Subject</label>
      <input
        type="text"
        id="subject"
        name="subject"
        required>

      <label for="message">Your Message</label>
      <textarea
        id="message"
        name="message"
        rows="6"
        required></textarea>

      <button type="submit">Submit</button>
    </form>

    <p>
      Note: This is a front-end demonstration form.
      It does not send messages to an email address yet.
    </p>
  </main>

  <footer class="site-footer">
